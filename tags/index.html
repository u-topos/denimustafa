(function () {
  function initHorizontalGalleries() {
    document.querySelectorAll('.site-horizontal-gallery, [data-horizontal-gallery]').forEach(function (gallery) {
      if (gallery.dataset.horizontalGalleryReady === '1') return;

      const strip = gallery.querySelector('.site-horizontal-gallery__strip, [data-horizontal-gallery-strip]');
      const track = gallery.querySelector('.site-horizontal-gallery__progress');
      if (!strip || !track) return;

      // Always construct the marker; the Publii editor need not preserve it.
      let thumb = track.querySelector('.site-horizontal-gallery__thumb');
      if (!thumb) {
        thumb = document.createElement('span');
        thumb.className = 'site-horizontal-gallery__thumb';
        track.textContent = '';
        track.appendChild(thumb);
      }
      gallery.dataset.horizontalGalleryReady = '1';

      let pending = false;
      function updateProgress() {
        pending = false;
        const visible = strip.clientWidth;
        const total = strip.scrollWidth;
        const line = track.clientWidth;
        if (!visible || !total || !line) return;

        const maxScroll = Math.max(0, total - visible);
        const markerWidth = maxScroll
          ? Math.min(line, Math.max(20, line * visible / total))
          : line;
        const progress = maxScroll
          ? Math.max(0, Math.min(1, strip.scrollLeft / maxScroll))
          : 0;
        thumb.style.width = markerWidth + 'px';
        thumb.style.transform = 'translateX(' + ((line - markerWidth) * progress) + 'px)';
      }
      function requestProgress() {
        if (pending) return;
        pending = true;
        requestAnimationFrame(updateProgress);
      }

      strip.addEventListener('scroll', requestProgress, { passive: true });
      window.addEventListener('resize', requestProgress);
      window.addEventListener('pageshow', requestProgress);
      if ('ResizeObserver' in window) {
        const observer = new ResizeObserver(requestProgress);
        observer.observe(strip);
        observer.observe(track);
      }
      strip.querySelectorAll('img').forEach(function (img) {
        if (!img.complete) img.addEventListener('load', requestProgress, { once: true });
      });

      // Mouse drag only. Touch swipe and vertical touch scrolling stay native.
      let pointerId = null;
      let startX = 0;
      let startLeft = 0;
      function endDrag(event) {
        if (pointerId === null || (event && event.pointerId !== pointerId)) return;
        const endedId = pointerId;
        pointerId = null;
        strip.classList.remove('is-dragging');
        if (strip.hasPointerCapture(endedId)) strip.releasePointerCapture(endedId);
      }
      strip.addEventListener('pointerdown', function (event) {
        if (event.pointerType !== 'mouse' || event.button !== 0) return;
        // Mobile-only strips use native touch swipe; never capture mouse clicks on images.
        if (gallery.getAttribute('data-horizontal-gallery') === 'mobile') return;
        pointerId = event.pointerId;
        startX = event.clientX;
        startLeft = strip.scrollLeft;
        strip.classList.add('is-dragging');
        strip.setPointerCapture(pointerId);
        event.preventDefault();
      });
      strip.addEventListener('pointermove', function (event) {
        if (pointerId !== event.pointerId) return;
        strip.scrollLeft = startLeft - (event.clientX - startX);
        requestProgress();
      });
      strip.addEventListener('pointerup', endDrag);
      strip.addEventListener('pointercancel', endDrag);
      strip.addEventListener('lostpointercapture', function () {
        pointerId = null;
        strip.classList.remove('is-dragging');
      });
      strip.addEventListener('dragstart', function (event) { event.preventDefault(); });

      requestProgress();
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initHorizontalGalleries);
  } else {
    initHorizontalGalleries();
  }
})();
